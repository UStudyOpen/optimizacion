project:
  type: website
  output-dir: _site
  render:
  - index.qmd
  - lecciones/01-problemas-optimizacion.qmd
  - lecciones/02-convexidad.qmd
  - lecciones/03-modelos-equivalentes.qmd
  - lecciones/04-poliedros.qmd
  - lecciones/05-fundamentos-simplex.qmd
  - lecciones/06-simplex-fase-i.qmd
  - lecciones/07-simplex-fase-ii.qmd
  - lecciones/08-casos-especiales.qmd
  resources:
  - .nojekyll
  - assets/optimizacion/**
  post-render:
  - python3 tests/post_render.py
