metadata-files:
- course.yml
quarto-required: =1.10.18
lang: es
brand:
  light: _extensions/ustudyopen-design/brand/_brand.yml
  dark: _extensions/ustudyopen-design/brand/_brand-dark.yml
website:
  title: Optimización
  description: Fundamentos de optimización matemática y programación lineal.
  site-url: https://ustudyopen.github.io/optimizacion/
  favicon: _extensions/ustudyopen-design/assets/favicon.svg
  search:
    location: navbar
    type: overlay
  navbar:
    title: UStudyOpen
    pinned: true
    background: light
    collapse-below: lg
    left:
    - text: Optimización
      href: index.qmd
    - text: Inicio
      href: index.qmd
  sidebar:
    title: Optimización · ICS1113
    style: docked
    collapse-level: 1
    contents:
    - text: Inicio
      href: index.qmd
    - section: Fundamentos de optimización
      contents:
      - href: lecciones/01-problemas-optimizacion.qmd
        text: "Problemas de optimización y existencia de soluciones"
      - href: lecciones/02-convexidad.qmd
        text: "Convexidad, optimalidad global y unicidad"
    - section: Modelación y reformulación
      contents:
      - href: lecciones/03-modelos-equivalentes.qmd
        text: "Modelos equivalentes y variables auxiliares"
    - section: Geometría de la programación lineal
      contents:
      - href: lecciones/04-poliedros.qmd
        text: "Poliedros, vértices y soluciones óptimas"
    - section: Algoritmo Simplex
      contents:
      - href: lecciones/05-fundamentos-simplex.qmd
        text: "Fundamentos algebraicos del Simplex"
      - href: lecciones/06-simplex-fase-i.qmd
        text: "Simplex — Fase I"
      - href: lecciones/07-simplex-fase-ii.qmd
        text: "Simplex — Fase II"
      - href: lecciones/08-casos-especiales.qmd
        text: "Soluciones múltiples, degeneración y ciclos"
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
